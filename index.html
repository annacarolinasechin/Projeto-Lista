<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./src/css/style.css"> <!-- css é obrigatoriamente no head-->
    <title>Lista de Itens</title>
</head>
<body>
    <h1>LISTA DE ITENS</h1>
    <div class="list-container">

        <div class="list-box-container">
            <div class="list-box">

                <div class="list-header">
                    <h2>Nome</h2>
                    <h2 class="date-text">Data</h2>
                </div>

                <div class="list-item">
                    <span class="list-name">Exemplo</span> <!-- linha genérica, agrupa elementos-->
                    <span class="list-date">32/13/2067</span>
                    <button class="list-button">Remover</button>
                </div>

            </div>
            
        </div>

        

        <div class="list-footer">
            <button>Adicionar</button>
        </div>

    </div>

    <script src="./src/js/script.js"></script> <!--js é obrigatório dentro do body, preferêncialmente em seu final, já que é o js que "lê" o htmm/css-->
</body>
</html>
